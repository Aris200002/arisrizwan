name: build-debug

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/NarutoSenki/**'
      - 'cocos2dx/**'
      - 'CocosDenshion/**'
      - 'extensions/**'
      - 'scripting/**'
      - 'external/**'
      - '.github/workflows/build-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17 diperlukan oleh AGP 8.9.2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # SDK 36 dan NDK 28.2
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358"

      # Konfigurasi SDK
      - name: Configure Android SDK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Pastikan Java tidak berubah ke Java 8
      - name: Verify Java and Gradle
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version

      # Izin menjalankan Gradle
      - name: Grant execute permission
        working-directory: projects/NarutoSenki/proj.android-studio
        run: chmod +x gradlew

      # Build APK
      - name: Build Debug APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          ./gradlew assembleDebug --stacktrace

      # Cari APK
      - name: Locate APK
        if: always()
        run: find . -name "*.apk"

      # Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: narutosenki-test-apk
          path: '**/*.apk'

      # Upload log jika gagal
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            projects/NarutoSenki/proj.android-studio/app/build/outputs/logs/**
            projects/NarutoSenki/proj.android-studio/**/build.log