name: build-debug

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths:
      - 'projects/NarutoSenki/**'
      - 'cocos2dx/**'
      - 'CocosDenshion/**'
      - 'extensions/**'
      - 'scripting/**'
      - 'external/**'
      - '.github/workflows/build-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALL JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. SETUP ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 4. INSTALL SDK, BUILD TOOLS, AND NDK
      # ==========================================
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358"

      # ==========================================
      # 5. CONFIGURE ANDROID SDK
      # ==========================================
      - name: Configure Android SDK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ==========================================
      # 6. GRANT EXECUTE PERMISSION
      # ==========================================
      - name: Grant execute permission
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          chmod +x gradlew

      # ==========================================
      # 7. VERIFY JAVA AND GRADLE
      # ==========================================
      - name: Verify Java and Gradle
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          echo "========== JAVA VERSION =========="
          java -version

          echo "========== JAVA HOME =========="
          echo "$JAVA_HOME"

          echo "========== GRADLE VERSION =========="
          ./gradlew --version

      # ==========================================
      # 8. BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      # ==========================================
      # 9. LOCATE APK
      # ==========================================
      - name: Locate APK
        if: always()
        run: |
          echo "========== APK FILES =========="
          find . -type f -name "*.apk"

      # ==========================================
      # 10. UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: narutosenki-test-apk
          path: |
            projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ==========================================
      # 11. UPLOAD BUILD LOGS IF FAILED
      # ==========================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: narutosenki-build-logs
          path: |
            projects/NarutoSenki/proj.android-studio/app/build/outputs/logs/**
            projects/NarutoSenki/proj.android-studio/app/build/reports/**
            projects/NarutoSenki/proj.android-studio/build/reports/**
          if-no-files-found: warn